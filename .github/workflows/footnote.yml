name: footnote

on:
  schedule:
    - cron: "30 1 * * *"  # 01:30 UTC = 07:00 IST
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node footnote.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
